services:
  postgres:
    image: postgres:15-alpine
    container_name: cervello_visivo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cervello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cervello_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cervello_visivo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cervello} -d ${POSTGRES_DB:-cervello_visivo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cervello_visivo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cervello.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: cervello_visivo_postgres_data
  pgadmin_data:
    name: cervello_visivo_pgadmin_data
